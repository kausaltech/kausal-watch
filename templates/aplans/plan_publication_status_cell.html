{% load wagtailadmin_tags %}
<td {% if column.classname %}class="{{ column.classname }}"{% endif %}>
    <span class="plan-status">
        <span class="w-status {{ status_class }}" style="cursor: pointer;" data-controller="w-tooltip" data-w-tooltip-content-value="{{ tooltip }}">
            {{ status_label }}
        </span>
        {% if is_internal %}
            <span class="plan-status-internal" data-controller="w-tooltip" data-w-tooltip-content-value="{{ internal_tooltip }}">
                <svg class="icon icon-key" aria-hidden="true"><use href="#icon-key"></use></svg>
            </span>
        {% endif %}
    </span>
</td>
