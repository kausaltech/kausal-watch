[settings]
env_cache = true
env_cache_ttl = "8h"
python.uv_venv_auto = "source"
experimental = true

[tools]
prek = "0.5.2"
vault = "2.1.0"
fnox = "1.35.0"

[env]
SENTRY_ORG = "kausal"
SENTRY_PROJECT = "watch-backend"
_.python.venv = { path = ".venv", create = true, uv_create_args = [] }
_.fnox-env = { tools = true }

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

# The providers that build the private extensions (client bundles, translations) live in the
# submodule and are loaded through the symlink in `mise/conf.d/`. They are no-ops when the
# submodule is not checked out.
[deps.uv]
auto = false
run = "uv sync --all-groups --all-extras"

[deps.uv-tools]
auto = true
description = "Install development tools with uv"
outputs = [".mise/uv_tools_installed"]
run = "sh -c 'uv tool install pyproject-fmt@latest && echo $(date) >> .mise/uv_tools_installed'"

[tasks.vault-token]
description = "Refresh the Vault token in the keychain"
run = "vault login -address=https://vault.kausal.tech -path=keycloak -method=oidc -token-only | fnox set -p keychain FNOX_VAULT_TOKEN"

[tasks.portless]
description = "Run the backend with Portless"
env = { PORTLESS_WILDCARD = "1", "PORTLESS_TLD" = "test" }
run = """
echo -en "\\e]2;portless: Kausal Watch backend\\a"
portless --name watch-backend --app-port 8042 kausal_common/development/tools/portless-backend.sh
"""
raw = true

[tasks.export-graphql-schema]
description = "Export the GraphQL schema from the Django project"
run = [
  'mkdir -p __generated__',
  'python manage.py export_schema aplans.schema > __generated__/schema.graphql',
  'ENABLE_TEST_MODE=1 python manage.py export_schema aplans.schema > __generated__/schema-test-mode.graphql'
]
