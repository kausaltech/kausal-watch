{% load i18n wagtailadmin_tags %}
<p class="help">{% trans "Drag the plans into the order in which the public site lists them. Each change is saved right away." %}</p>
<table
    class="listing"
    data-controller="w-orderable"
    data-w-orderable-active-class="w-orderable--active"
    data-w-orderable-chosen-class="w-orderable__item--active"
    data-w-orderable-container-value="tbody"
    data-w-orderable-message-value="{{ success_message }}"
    data-w-orderable-url-value="{{ reorder_url }}"
>
    <tbody>
        {% for child_plan in child_plans %}
            <tr
                id="item_{{ child_plan.pk }}"
                data-w-orderable-item-id="{{ child_plan.pk }}"
                data-w-orderable-item-label="{{ child_plan.name }}"
                data-w-orderable-target="item"
            >
                <td class="ord">
                    <button
                        class="w-orderable__item__handle button button-small text-replace button--icon"
                        type="button"
                        aria-live="polite"
                        data-w-orderable-target="handle"
                        data-action="keydown.up->w-orderable#up:prevent keydown.down->w-orderable#down:prevent keydown.enter->w-orderable#apply"
                    >
                        {% icon name="grip" classname="default" %}
                        <span class="w-sr-only">
                            {% trans 'Drag' %}
                            <span>
                                {% blocktranslate trimmed with index=forloop.counter total=child_plans|length %}Item {{ index }} of {{ total }}{% endblocktranslate %}
                            </span>
                        </span>
                    </button>
                </td>
                <td>{{ child_plan.name }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
