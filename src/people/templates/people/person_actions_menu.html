{% load i18n wagtailadmin_tags %}
{% if buttons %}
    {% dropdown toggle_icon="dots-horizontal" toggle_aria_label=_("Actions") hide_on_click=True %}
        {% for button in buttons %}
            <a href="{{ button.url }}" title="{{ button.title }}">{{ button.label }}</a>
        {% endfor %}
    {% enddropdown %}
{% endif %}
